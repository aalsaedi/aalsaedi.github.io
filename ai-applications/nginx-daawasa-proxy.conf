# Example Nginx config for this setup:
# - Frontend files are hosted on GitHub Pages
# - Browser calls https://daawasa.com/ask
# - Nginx proxies internally to http://daawasa.com:8447/ask
#
# Update the allowed origin below if your GitHub Pages URL differs.

map $http_origin $cors_allow_origin {
    default "";
    "https://aalsaedi.github.io" $http_origin;
    # Example if you later add a custom frontend domain:
    # "https://your-frontend.example.com" $http_origin;
}

server {
    listen 80;
    server_name daawasa.com www.daawasa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name daawasa.com www.daawasa.com;

    # Add your existing SSL certificate directives here.
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    location = /ask {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary "Origin" always;
            return 204;
        }

        proxy_pass http://daawasa.com:8447/ask;
        proxy_http_version 1.1;

        proxy_set_header Host daawasa.com:8447;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Vary "Origin" always;
    }
}
