<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flappy Gravity</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      font-family: Arial;
    }

    h1 {
      color: #fff;
      margin: 20px 0 5px 0;
      text-align: center;
    }

    #score-text {
      color: #fff;
      font-size: 24px;
      margin-bottom: 5px;
    }

    #game-container {
      margin-top: 10px;
      position: relative;
      width: 600px;
      height: 400px;
    }

    #game-over-text {
      color: #fff;
      text-align: center;
      font-size: 28px;
      margin: 5px 0;
      display: none;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }

    #restart-btn { display: none; }
  </style>
</head>
<body>

<h1>Flappy Gravity</h1>
<div id="score-text">Score: 0</div>
<div id="game-container"></div>
<div id="game-over-text">GAME OVER</div>
<button id="start-btn">START</button>
<button id="restart-btn">RESTART</button>

<script src="phaser.min.js"></script>
<script src="preloadGame.js"></script>
<script src="playGame.js"></script>
<script src="game.js"></script>

</body>
</html>
