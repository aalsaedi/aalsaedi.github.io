<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bee Diamond Quest Game</title>
    <style>
          body { 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            flex-direction: column;
            background-color:  #030342;
        }
        .stage-text {
            font-size: 34px;
            color: rgb(221, 225, 232);
            font-weight: bold;
            margin-bottom: 20px;
        }
        .game-over {
            font-size: 28px;
            color: red;
            font-weight: bold;
            text-shadow: 2px 2px 5px #fff;
        }
        .game-info {
            font-size: 20px;
            color: #fff;
            font-weight: bold;
            margin: 10px;
        }
        .game-info span {
            margin-right: 10px;
        }
    </style>
<div class="stage-text" id="stageText">Bee Diamond Quest</div>
<div id="stage"></div>
</head>

<body>
    
    <script src="phaser.min.js"></script>
    <script src="PreloadGame.js"></script>
    <script src="PlayGame.js"></script>
    <script src="game.js"></script>
    
</body>
</html>
